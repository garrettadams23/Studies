name: build-check

# Ensures index.html is always the exact output of `python build.py` over the
# sources in data/*. Fails if someone hand-edited index.html or forgot to rebuild.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # stamp_freshness.py reads git history, so a shallow clone will not do
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The gate on the gates: this file and the Makefile must agree about what
      # has to pass. They did not, and the disagreement is how the two failures
      # below went unnoticed for nine commits — see tools/check_gates.py.
      - name: Check the Makefile and this workflow run the same gates
        run: python tools/check_gates.py

      # --check rather than "generate, then git diff": the old form left the
      # working tree dirty, so nobody ran it locally, so it only ever failed
      # here — where it failed on every push, silently, while four acronyms and
      # a whole subject group stayed out of the shipped domain.
      - name: Check the acronym domain is not stale
        run: python tools/gen_acronym_domain.py --check

      # No browser needed: the card carries its inputs in a PNG tEXt chunk, so
      # this is a string comparison. It used to compare rendered bytes, which is
      # a gate on the rasteriser, and it was red long enough that the card
      # claimed 1,519 topics on every shared link while the site had 1,534.
      - name: Check the social card is current
        run: node tools/gen_og_image.mjs --check

      - name: Check topic names and the slug alias map
        run: python tools/fix_topic_names.py --check

      - name: Check the TI-84 drill bank
        run: python tools/ti84_trainer.py --verify

      - name: Check the TI-84 card lists the drill bank's real areas
        run: python tools/ti84_trainer.py --check-card

      - name: Check the calculus cheat sheet is not stale
        run: python tools/gen_cheatsheet.py --check

      # A real parser, not a text scan: lint_content.py checks conventions and
      # cannot see a <span> that was never closed. A domain's content is shipped
      # as text and only becomes elements when a reader opens that one domain,
      # so a stray tag is invisible until then.
      - name: Check the markup is well-formed
        run: python tools/check_markup.py

      # And prove the checker still fails on breakage. A validator reporting
      # "0 errors" is indistinguishable from one that stopped looking.
      - name: Self-test the markup checker
        run: python tools/check_markup.py --self-test

      # The acronym censuses ask "does this domain render X" for every entry in
      # the dictionary. Asking it per acronym was 184 of this gate's 201
      # seconds, so it is asked once per domain and answered from an index —
      # and this proves the index still answers what the pattern would.
      - name: Self-test the rendered-acronym index
        run: python tools/lint_content.py --self-test

      - name: Lint content conventions
        run: python tools/lint_content.py

      # The window that decides "is this already explained nearby" is measured
      # in text, not in markup. A styling commit moved it once; this is so one
      # cannot again.
      - name: Acronym window is markup-independent
        run: python tools/annotate_acronyms.py --self-test

      - name: Check inline acronym expansions
        run: python tools/annotate_acronyms.py --check

      # Old vendor names used as though current. "Azure AD" is worse than a
      # broken link: it reads as current and quietly dates the whole card.
      - name: Check for renamed products
        run: python tools/check_renames.py

      # A hand-written acronym expansion that disagrees with the dictionary is
      # a plain contradiction, and the annotator cannot see it — it only ever
      # adds expansions, never reads the ones an author typed.
      - name: Check for contradicted acronym expansions
        run: |
          python tools/check_contradictions.py --self-test
          python tools/check_contradictions.py --strict
          python tools/check_contradictions.py --pairs --strict

      # The three content censuses. None of them gates — they measure what the
      # gates cannot: how deep the cards are, whether a subject exists twice, and
      # which good cards nothing links to. Printed in the log so a reviewer sees
      # the numbers move. See plan.md Phases 8-10.
      - name: Content census (reports only)
        run: |
          python tools/depth_report.py
          python tools/near_duplicates.py
          python tools/orphan_report.py

      # Volatile spans and fact anchors: a malformed or future date, or an
      # anchor missing its source, fails. The vendor-console queue only reports.
      # The self-test guards the console regex, which was narrowed on measured
      # evidence (14 candidates, 3 real) and is one edit from being widened back.
      - name: Check dated claims
        run: |
          python tools/check_volatility.py --self-test
          python tools/check_volatility.py

      # --verify, not --check. --check re-derives every stamp from `git blame`,
      # and blame heuristics differ between git releases: this repo passed
      # --check under git 2.43 and failed it under 2.54 on a runner, with no
      # content change involved. --verify uses no git at all.
      - name: Check topic freshness stamps
        run: python tools/stamp_freshness.py --verify

      - name: Rebuild index.html
        run: python build.py

      # Two identical builds must produce identical bytes. Without this, a
      # timestamp or a set iteration turns every commit's diff into noise, and
      # noise is where a real change hides.
      - name: Check the build is reproducible
        run: python tools/check_determinism.py

      - name: Check the page performance budget
        run: python tools/page_budget.py

      # Every id in data/related.json resolves, and no topic points at itself.
      - name: Check the related-topics map
        run: python tools/suggest_related.py --check

      # Every step in every learning path points at a topic that exists. A path
      # drops what it cannot resolve, so a broken one renders as a shorter one.
      - name: Check the learning paths
        run: python tools/check_paths.py

      # build.py derives sw.js's CACHE_VERSION from the built assets, so a
      # stale version here means the service worker would serve an old page.
      - name: Fail if sw.js cache version is stale
        run: |
          if ! git diff --exit-code -- sw.js; then
            echo "::error::sw.js CACHE_VERSION is out of date. Run 'python build.py' and commit the result."
            exit 1
          fi

      - name: Fail if index.html is stale
        run: |
          if ! git diff --exit-code -- index.html; then
            echo "::error::index.html is out of date. Run 'python build.py' and commit the result."
            exit 1
          fi

  # Separate job: it needs Node and a browser, and none of the checks above do.
  # Kept out of verify-build so a markup typo still fails in seconds rather than
  # waiting on a Chromium download.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned deliberately. Unpinned, this line installs whatever npm published
      # most recently, so CI ran a different Playwright than `make browser`
      # proves locally — and on 2026-09-04 it took playwright@1.63.0 minutes
      # after publication, when the registry served the metadata but not yet the
      # tarball, and main went red on a content commit that touched no code.
      # These are the versions the local browser suite is green against; bump
      # them together, after running `make browser` on the new pair.
      - name: Install Playwright, axe-core and Chromium
        run: npm install playwright@1.56.0 axe-core@4.13.0 && npx playwright install --with-deps chromium

      - name: Build the page
        run: python build.py

      # Drives the real page: permalinks, per-domain study decks, progress
      # persistence, theming and keyboard navigation. plan.md has claimed this
      # verification since the first review; this is what makes the claim true.
      - name: Smoke-test the built page
        run: node tools/smoke_test.mjs

      # Does searching for a thing find it. Separate from the smoke test, which
      # checks that search *narrows the page*; this checks that it narrows to
      # the right card. A content change that renames a topic or rewords the
      # phrase a reader would search for breaks retrieval silently otherwise.
      - name: Search quality
        run: node tools/search_test.mjs

      # axe-core over the shell, an open domain and a dialog, in both themes.
      # Separate from the smoke test because it runs a third-party rule set that
      # can grow new rules between versions — mixing them would make a smoke
      # failure ambiguous.
      - name: Accessibility scan
        run: node tools/a11y_test.mjs

      # Pixel diff of the filter bar against a committed baseline, both themes.
      # Deliberately narrow: a suite that screenshots content fails on every
      # content wave, and a check that fails constantly gets ignored.
      - name: Visual regression (filter bar)
        run: node tools/visual_test.mjs

      # These three ran in `make all` and nowhere else, which meant they ran
      # only when somebody remembered. They gate the failure modes a reader
      # actually hits: a browser that denies storage, a phone-width viewport,
      # and an export that must restore exactly what it saved.
      - name: Resilience (storage denied)
        run: node tools/storage_denied_test.mjs

      - name: Mobile layout (375px)
        run: node tools/mobile_test.mjs

      - name: Backup round-trip
        run: node tools/backup_test.mjs
