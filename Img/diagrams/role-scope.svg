<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" class="role-svg" viewBox="0 0 1240 560" role="img" aria-labelledby="rolesvg-t rolesvg-d" preserveAspectRatio="xMidYMid meet">
  <style>
    svg { background: var(--bg); }
    :root {
      --bg: #07090f; --bg2: #0d1120; --bg3: #121a2e; --border: #1e2d4a;
      --cyan: #00d4ff; --green: #00ff99; --amber: #ffb020; --purple: #a855f7;
      --text: #cdd9f0; --muted: #5a6e8a;
      --mono: ui-monospace, "Share Tech Mono", "SFMono-Regular", monospace;
      --sans: "Outfit", "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff; --bg2: #ffffff; --bg3: #e8edf4; --border: #c5d0de;
        --cyan: #0284c7; --green: #059669; --amber: #b45309; --purple: #7c3aed;
        --text: #0f172a; --muted: #475569;
      }
    }
    .rsv-rings circle { stroke-width: 2; }
    .rsv-dev { fill: var(--purple); fill-opacity: 0.10; stroke: var(--purple); }
    .rsv-arch { fill: var(--cyan); fill-opacity: 0.10; stroke: var(--cyan); }
    .rsv-prog { fill: var(--amber); fill-opacity: 0.10; stroke: var(--amber); }
    .rsv-coder { fill: var(--green); fill-opacity: 0.12; stroke: var(--green); }
    .rsv-name { font-family: var(--sans); font-size: 25px; font-weight: 600; text-anchor: middle; }
    .rsv-t-dev { fill: var(--purple); }
    .rsv-t-arch { fill: var(--cyan); }
    .rsv-t-prog { fill: var(--amber); }
    .rsv-t-coder { fill: var(--green); }
    .rsv-core rect { fill: var(--bg2); stroke: var(--green); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .rsv-core text { font-family: var(--mono); font-size: 19px; fill: var(--green); text-anchor: middle; }
    .rsv-chip { fill: var(--bg2); stroke: var(--border); stroke-width: 1; }
    .rsv-chip-t { font-family: var(--sans); font-size: 12.5px; fill: var(--text); }
    .rsv-lead { stroke-width: 1; opacity: 0.55; }
    .rsv-dot { stroke: none; opacity: 0.75; }
    .rsv-l-dev { stroke: var(--purple); fill: var(--purple); }
    .rsv-l-arch { stroke: var(--cyan); fill: var(--cyan); }
    .rsv-l-prog { stroke: var(--amber); fill: var(--amber); }
    .rsv-c-dev { stroke: var(--purple); }
    .rsv-c-arch { stroke: var(--cyan); }
    .rsv-c-prog { stroke: var(--amber); }
    .rsv-question circle { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 7 6; }
    .rsv-question text { text-anchor: middle; fill: var(--muted); }
    .rsv-q1 { font-family: var(--sans); font-size: 30px; font-weight: 600; }
    .rsv-q2 { font-family: var(--sans); font-size: 42px; font-weight: 700; }
    .rsv-q3 { font-family: var(--mono); font-size: 15px; }
  </style>
  <title id="rolesvg-t">Job roles as nested scopes</title>
  <desc id="rolesvg-d">Coder sits inside Programmer, inside Architect, inside Developer. Each outer role owns everything the inner ones own plus its own responsibilities. Software engineer is drawn separately because it maps to any of them. The same information is in the table below.</desc>
  <g class="rsv-rings">
    <circle class="rsv-dev" cx="560" cy="275" r="255" />
    <circle class="rsv-arch" cx="580" cy="308" r="212" />
    <circle class="rsv-prog" cx="600" cy="345" r="165" />
    <circle class="rsv-coder" cx="630" cy="392" r="104" />
  </g>
  <g class="rsv-names">
    <text class="rsv-name rsv-t-dev" x="560" y="60">Developer</text>
    <text class="rsv-name rsv-t-arch" x="580" y="136">Architect</text>
    <text class="rsv-name rsv-t-prog" x="600" y="218">Programmer</text>
    <text class="rsv-name rsv-t-coder" x="630" y="322">Coder</text>
  </g>
  <g class="rsv-core">
    <rect x="562" y="368" width="136" height="46" rx="7" />
    <text x="630" y="397">Coding</text>
  </g>
  <g class="rsv-chips">
    <line class="rsv-lead rsv-l-dev" x1="200" y1="70" x2="438" y2="70" />
    <circle class="rsv-dot rsv-l-dev" cx="438" cy="70" r="3.5" />
    <rect class="rsv-chip rsv-c-dev" x="88" y="57" width="108" height="26" rx="5" />
    <text class="rsv-chip-t" x="99" y="74">Requirements</text>
    <line class="rsv-lead rsv-l-dev" x1="200" y1="108" x2="438" y2="108" />
    <circle class="rsv-dot rsv-l-dev" cx="438" cy="108" r="3.5" />
    <rect class="rsv-chip rsv-c-dev" x="117" y="95" width="79" height="26" rx="5" />
    <text class="rsv-chip-t" x="128" y="112">Planning</text>
    <line class="rsv-lead rsv-l-dev" x1="200" y1="146" x2="392" y2="146" />
    <circle class="rsv-dot rsv-l-dev" cx="392" cy="146" r="3.5" />
    <rect class="rsv-chip rsv-c-dev" x="17" y="133" width="179" height="26" rx="5" />
    <text class="rsv-chip-t" x="28" y="150">Business understanding</text>
    <line class="rsv-lead rsv-l-dev" x1="200" y1="184" x2="365" y2="184" />
    <circle class="rsv-dot rsv-l-dev" cx="365" cy="184" r="3.5" />
    <rect class="rsv-chip rsv-c-dev" x="131" y="171" width="65" height="26" rx="5" />
    <text class="rsv-chip-t" x="142" y="188">Budget</text>
    <line class="rsv-lead rsv-l-dev" x1="200" y1="222" x2="348" y2="222" />
    <circle class="rsv-dot rsv-l-dev" cx="348" cy="222" r="3.5" />
    <rect class="rsv-chip rsv-c-dev" x="102" y="209" width="94" height="26" rx="5" />
    <text class="rsv-chip-t" x="114" y="226">Deployment</text>
    <line class="rsv-lead rsv-l-arch" x1="200" y1="278" x2="410" y2="278" />
    <circle class="rsv-dot rsv-l-arch" cx="410" cy="278" r="3.5" />
    <rect class="rsv-chip rsv-c-arch" x="67" y="265" width="129" height="26" rx="5" />
    <text class="rsv-chip-t" x="78" y="282">Software design</text>
    <line class="rsv-lead rsv-l-arch" x1="200" y1="316" x2="403" y2="316" />
    <circle class="rsv-dot rsv-l-arch" cx="403" cy="316" r="3.5" />
    <rect class="rsv-chip rsv-c-arch" x="38" y="303" width="158" height="26" rx="5" />
    <text class="rsv-chip-t" x="49" y="320">System architecture</text>
    <line class="rsv-lead rsv-l-arch" x1="200" y1="354" x2="404" y2="354" />
    <circle class="rsv-dot rsv-l-arch" cx="404" cy="354" r="3.5" />
    <rect class="rsv-chip rsv-c-arch" x="45" y="341" width="151" height="26" rx="5" />
    <text class="rsv-chip-t" x="56" y="358">System integration</text>
    <line class="rsv-lead rsv-l-prog" x1="200" y1="396" x2="485" y2="396" />
    <circle class="rsv-dot rsv-l-prog" cx="485" cy="396" r="3.5" />
    <rect class="rsv-chip rsv-c-prog" x="110" y="383" width="86" height="26" rx="5" />
    <text class="rsv-chip-t" x="121" y="400">Processes</text>
    <line class="rsv-lead rsv-l-prog" x1="200" y1="428" x2="495" y2="428" />
    <circle class="rsv-dot rsv-l-prog" cx="495" cy="428" r="3.5" />
    <rect class="rsv-chip rsv-c-prog" x="102" y="415" width="94" height="26" rx="5" />
    <text class="rsv-chip-t" x="114" y="432">Algorithms</text>
    <line class="rsv-lead rsv-l-prog" x1="200" y1="460" x2="516" y2="460" />
    <circle class="rsv-dot rsv-l-prog" cx="516" cy="460" r="3.5" />
    <rect class="rsv-chip rsv-c-prog" x="74" y="447" width="122" height="26" rx="5" />
    <text class="rsv-chip-t" x="85" y="464">Business logic</text>
    <line class="rsv-lead rsv-l-prog" x1="200" y1="492" x2="563" y2="492" />
    <circle class="rsv-dot rsv-l-prog" cx="563" cy="492" r="3.5" />
    <rect class="rsv-chip rsv-c-prog" x="74" y="479" width="122" height="26" rx="5" />
    <text class="rsv-chip-t" x="85" y="496">Prioritization</text>
  </g>
  <g class="rsv-question">
    <circle cx="1040" cy="275" r="172" />
    <text class="rsv-q1" x="1040" y="262">Software engineer</text>
    <text class="rsv-q2" x="1040" y="316">?</text>
    <text class="rsv-q3" x="1040" y="368">usually all four, by another name</text>
  </g>
</svg>
